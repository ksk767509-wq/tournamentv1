<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Adept Play</title>
  <!-- Tailwind CDN (play CDN for demo) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {} }, darkMode: 'class' }
  </script>
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/your_kit_id.js" crossorigin="anonymous"></script>
  <style>
    /* Make app look native: fixed height to avoid overscroll on mobile */
    html,body,#app{height:100%;}
  </style>
</head>
<body class="bg-gray-900 text-gray-100 antialiased" oncontextmenu="return false">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- HEADER (persistent) -->
    <header id="app-header" class="w-full bg-gray-800/60 backdrop-blur sticky top-0 z-40">
      <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center text-white font-bold">AP</div>
          <div>
            <div class="text-sm font-semibold">Adept Play</div>
            <div id="header-sub" class="text-xs text-gray-300">Play. Compete. Win.</div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="wallet-balance" class="text-sm font-medium">₹0</div>
          <button id="header-profile-btn" class="p-2 rounded-lg hover:bg-gray-700/40">
            <i class="fa fa-user"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN (sections) -->
    <main class="flex-1 overflow-auto">
      <div class="max-w-xl mx-auto px-4 py-6">

        <!-- AUTH SECTION -->
        <section id="auth-section" class="space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4 shadow">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-lg font-semibold">Welcome</h2>
              <div class="text-xs text-gray-400">Mobile-first SPA</div>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-4">
              <button id="tab-login" class="py-2 rounded-lg bg-gray-700">Login</button>
              <button id="tab-signup" class="py-2 rounded-lg bg-transparent border border-gray-700">Sign Up</button>
            </div>
            <form id="auth-form" class="space-y-3">
              <input id="auth-username" class="w-full rounded-lg bg-gray-900 px-3 py-2 text-sm" placeholder="Username (for signup)" />
              <input id="auth-email" type="email" class="w-full rounded-lg bg-gray-900 px-3 py-2 text-sm" placeholder="Email" required />
              <input id="auth-password" type="password" class="w-full rounded-lg bg-gray-900 px-3 py-2 text-sm" placeholder="Password" required />
              <div class="flex justify-between items-center">
                <button id="auth-submit" class="px-4 py-2 rounded-lg bg-indigo-600">Submit</button>
                <button id="guest-btn" type="button" class="text-xs text-gray-400">Continue as Guest</button>
              </div>
            </form>
          </div>
        </section>

        <!-- HOME SECTION -->
        <section id="home-section" class="hidden space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold">Upcoming Tournaments</h2>
            <div class="text-xs text-gray-400" id="home-sub">Live updates</div>
          </div>

          <div id="tournaments-grid" class="grid grid-cols-1 gap-3">
            <!-- Tournament cards injected here -->
          </div>
        </section>

        <!-- MY TOURNAMENTS -->
        <section id="my-tournaments-section" class="hidden space-y-4">
          <div class="flex gap-2">
            <button id="my-tab-active" class="flex-1 py-2 rounded-lg bg-gray-700">Upcoming / Live</button>
            <button id="my-tab-completed" class="flex-1 py-2 rounded-lg bg-transparent border border-gray-700">Completed</button>
          </div>
          <div id="my-tournaments-list" class="space-y-3"></div>
        </section>

        <!-- WALLET -->
        <section id="wallet-section" class="hidden space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4">
            <div class="text-xs text-gray-400">Wallet Balance</div>
            <div id="wallet-display" class="text-2xl font-bold py-2">₹0</div>
            <div class="flex gap-2">
              <button id="add-money-btn" class="flex-1 py-2 rounded-lg bg-green-600">Add ₹100</button>
              <button id="withdraw-btn" class="flex-1 py-2 rounded-lg bg-yellow-600">Withdraw ₹100</button>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-2">Transactions</h3>
            <div id="transactions-list" class="space-y-2"></div>
          </div>
        </section>

        <!-- PROFILE -->
        <section id="profile-section" class="hidden space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4">
            <h3 class="text-sm font-semibold mb-2">Profile</h3>
            <input id="profile-username" class="w-full rounded-lg bg-gray-900 px-3 py-2 text-sm mb-2" />
            <input id="profile-email" class="w-full rounded-lg bg-gray-900 px-3 py-2 text-sm mb-2" />
            <div class="flex gap-2">
              <button id="save-profile-btn" class="flex-1 py-2 rounded-lg bg-indigo-600">Save</button>
              <button id="change-password-btn" class="flex-1 py-2 rounded-lg bg-gray-700">Change Password</button>
            </div>
            <button id="logout-btn" class="w-full mt-3 py-2 rounded-lg bg-red-600">Logout</button>
          </div>
        </section>

        <!-- ADMIN DASHBOARD -->
        <section id="admin-dashboard-section" class="hidden space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold">Admin Dashboard</h2>
            <button id="create-new-btn" class="py-2 px-3 rounded-lg bg-indigo-600">Create Tournament</button>
          </div>
          <div id="admin-stats" class="grid grid-cols-2 gap-3"></div>
          <div id="admin-tournaments-list" class="space-y-3"></div>
        </section>

        <!-- MANAGE TOURNAMENT SECTION -->
        <section id="manage-tournament-section" class="hidden space-y-4">
          <div class="bg-gray-800 rounded-2xl p-4">
            <h3 class="text-sm font-semibold mb-2">Manage Tournament</h3>
            <div id="manage-details"></div>
            <div id="manage-participants" class="mt-3"></div>
            <div class="mt-3 flex gap-2">
              <button id="update-room-btn" class="flex-1 py-2 rounded-lg bg-green-600">Update Room</button>
              <button id="declare-winner-btn" class="flex-1 py-2 rounded-lg bg-yellow-600">Declare Winner</button>
            </div>
          </div>
        </section>

      </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="w-full bg-gray-800/60 backdrop-blur fixed bottom-4 left-0 right-0 mx-auto max-w-xl px-4">
      <div class="bg-gray-900 rounded-3xl p-2 flex justify-between">
        <button data-route="home" class="nav-btn flex-1 py-3 text-center"><i class="fa fa-home"></i><div class="text-xs">Home</div></button>
        <button data-route="my" class="nav-btn flex-1 py-3 text-center"><i class="fa fa-trophy"></i><div class="text-xs">My</div></button>
        <button data-route="wallet" class="nav-btn flex-1 py-3 text-center"><i class="fa fa-wallet"></i><div class="text-xs">Wallet</div></button>
        <button data-route="profile" class="nav-btn flex-1 py-3 text-center"><i class="fa fa-user"></i><div class="text-xs">Profile</div></button>
      </div>
    </nav>

    <!-- Toast container -->
    <div id="toast-root" class="fixed right-4 bottom-28 z-50"></div>

  </div>

  <!-- Firebase + App scripts (module) -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/router.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/user-data.js"></script>
  <script type="module" src="js/admin-data.js"></script>

  <script>
    // Disable text selection + copy + zoom shortcuts
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=')) e.preventDefault();
      // block F12
      if (e.key === 'F12') e.preventDefault();
    });
    window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  </script>
</body>
            </html>
