<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Adept Play</title>
  <!-- Tailwind CDN (for quick dev) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="" crossorigin="anonymous" />
  <style>
    /* App-level tweaks */
    html,body,#app{height:100%;}
    body{background:#0f172a;color:#e6eef8;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    /* Make app look native (disable selection cursor) */
    *{user-select:none;-webkit-user-select:none;-ms-user-select:none}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header id="app-header" class="flex items-center justify-between p-4 sticky top-0 bg-gradient-to-b from-slate-900/80 to-transparent z-20">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-white font-bold">AP</div>
        <div>
          <div class="text-sm font-semibold">Adept Play</div>
          <div id="header-sub" class="text-xs text-slate-400">Mobile-first Esports</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="wallet-badge" class="text-right">
          <div class="text-xs text-slate-400">Wallet</div>
          <div id="wallet-amount" class="text-sm font-semibold">₹0</div>
        </div>
        <button id="header-profile-btn" class="p-2 rounded-lg bg-slate-800/60"><i class="fa-solid fa-user"></i></button>
      </div>
    </header>

    <!-- Main SPA Container -->
    <main id="main" class="flex-1 overflow-auto p-4 pb-24">

      <!-- AUTH SECTION -->
      <section id="auth-section" class="max-w-xl mx-auto space-y-4">
        <div class="bg-slate-900/60 rounded-2xl p-4">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Welcome back</h2>
            <div class="text-xs text-slate-400">Play & Win</div>
          </div>

          <!-- Tab buttons -->
          <div class="flex bg-slate-800 rounded-lg p-1 mb-4" role="tablist">
            <button id="tab-login" class="flex-1 py-2 rounded-lg font-medium" data-tab="login">Login</button>
            <button id="tab-signup" class="flex-1 py-2 rounded-lg font-medium" data-tab="signup">Sign Up</button>
          </div>

          <!-- Login Form -->
          <div id="login-form" class="space-y-3">
            <input id="login-email" type="email" placeholder="Email" class="w-full p-3 rounded-lg bg-slate-800/50 text-sm" />
            <input id="login-password" type="password" placeholder="Password" class="w-full p-3 rounded-lg bg-slate-800/50 text-sm" />
            <button id="btn-login" class="w-full py-3 rounded-lg bg-indigo-600 text-white font-semibold">Login</button>
          </div>

          <!-- Signup Form -->
          <div id="signup-form" class="space-y-3 hidden">
            <input id="signup-username" type="text" placeholder="Username" class="w-full p-3 rounded-lg bg-slate-800/50 text-sm" />
            <input id="signup-email" type="email" placeholder="Email" class="w-full p-3 rounded-lg bg-slate-800/50 text-sm" />
            <input id="signup-password" type="password" placeholder="Password" class="w-full p-3 rounded-lg bg-slate-800/50 text-sm" />
            <button id="btn-signup" class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold">Create account</button>
          </div>

        </div>
      </section>

      <!-- HOME SECTION -->
      <section id="home-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Upcoming Tournaments</h3>
          <div id="home-filter" class="text-xs text-slate-400">Real-time</div>
        </div>
        <div id="tournaments-grid" class="grid grid-cols-1 gap-3"></div>
      </section>

      <!-- MY TOURNAMENTS -->
      <section id="my-tournaments-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="flex items-center gap-2">
          <button id="mytab-upcoming" class="flex-1 py-2 rounded-lg">Upcoming/Live</button>
          <button id="mytab-completed" class="flex-1 py-2 rounded-lg">Completed</button>
        </div>
        <div id="my-tournaments-list" class="space-y-3"></div>
      </section>

      <!-- WALLET -->
      <section id="wallet-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="bg-slate-900/50 rounded-xl p-4">
          <div class="text-sm text-slate-400">Current Balance</div>
          <div id="wallet-big" class="text-2xl font-bold mt-2">₹0</div>
          <div class="flex gap-3 mt-4">
            <button id="btn-add-money" class="flex-1 py-2 rounded-lg bg-indigo-600">Add ₹100</button>
            <button id="btn-withdraw" class="flex-1 py-2 rounded-lg bg-slate-700">Withdraw ₹100</button>
          </div>
        </div>
        <div>
          <h4 class="text-sm font-semibold mb-2">Transactions</h4>
          <div id="transactions-list" class="space-y-2"></div>
        </div>
      </section>

      <!-- PROFILE -->
      <section id="profile-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="bg-slate-900/50 rounded-xl p-4 space-y-3">
          <input id="profile-username" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Username" />
          <input id="profile-email" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Email" />
          <div class="flex gap-2">
            <button id="btn-update-profile" class="flex-1 py-2 rounded-lg bg-green-600">Save</button>
            <button id="btn-change-password" class="flex-1 py-2 rounded-lg bg-yellow-600">Change Password</button>
          </div>
          <button id="btn-logout" class="w-full py-2 rounded-lg bg-red-600">Logout</button>
        </div>
      </section>

      <!-- ADMIN DASHBOARD -->
      <section id="admin-dashboard-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-900/40 p-4 rounded-lg"> <div class="text-xs text-slate-400">Users</div><div id="stat-users" class="text-xl font-bold">0</div></div>
          <div class="bg-slate-900/40 p-4 rounded-lg"> <div class="text-xs text-slate-400">Tournaments</div><div id="stat-tournaments" class="text-xl font-bold">0</div></div>
          <div class="bg-slate-900/40 p-4 rounded-lg"> <div class="text-xs text-slate-400">Prize Distributed</div><div id="stat-prize" class="text-xl font-bold">₹0</div></div>
          <div class="bg-slate-900/40 p-4 rounded-lg"> <div class="text-xs text-slate-400">Commission</div><div id="stat-commission" class="text-xl font-bold">₹0</div></div>
        </div>
        <div class="flex gap-3">
          <button id="btn-create-tournament" class="flex-1 py-2 rounded-lg bg-indigo-600">Create Tournament</button>
        </div>
        <div id="admin-tournaments-list" class="space-y-3"></div>
      </section>

      <!-- TOURNAMENT MANAGEMENT -->
      <section id="tournament-section" class="hidden max-w-xl mx-auto space-y-4">
        <div class="bg-slate-900/50 p-4 rounded-lg space-y-3">
          <input id="t-title" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Title" />
          <input id="t-game" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Game Name" />
          <div class="grid grid-cols-2 gap-2">
            <input id="t-entry" type="number" class="p-3 rounded-lg bg-slate-800/50" placeholder="Entry Fee (₹)" />
            <input id="t-prize" type="number" class="p-3 rounded-lg bg-slate-800/50" placeholder="Prize Pool (₹)" />
          </div>
          <input id="t-time" type="datetime-local" class="w-full p-3 rounded-lg bg-slate-800/50" />
          <input id="t-commission" type="number" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Commission %" />
          <div class="flex gap-2">
            <button id="btn-save-tournament" class="flex-1 py-2 rounded-lg bg-green-600">Save</button>
            <button id="btn-cancel-tournament" class="flex-1 py-2 rounded-lg bg-slate-700">Cancel</button>
          </div>
        </div>
        <div id="admin-all-tournaments" class="space-y-3"></div>
      </section>

      <!-- MANAGE SINGLE TOURNAMENT -->
      <section id="manage-tournament-section" class="hidden max-w-xl mx-auto space-y-4">
        <div id="manage-tournament-header" class="bg-slate-900/50 p-3 rounded-lg"></div>
        <div class="bg-slate-900/50 p-3 rounded-lg space-y-3">
          <input id="room-id" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Room ID" />
          <input id="room-pass" class="w-full p-3 rounded-lg bg-slate-800/50" placeholder="Room Password" />
          <div class="flex gap-2">
            <button id="btn-save-room" class="flex-1 py-2 rounded-lg bg-indigo-600">Save Room</button>
            <button id="btn-declare" class="flex-1 py-2 rounded-lg bg-yellow-600">Declare Winner</button>
          </div>
        </div>
        <div>
          <h4 class="text-sm font-semibold mb-2">Participants</h4>
          <div id="participants-list" class="space-y-2"></div>
        </div>
      </section>

    </main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-xl bg-slate-900/70 backdrop-blur rounded-2xl p-2 flex justify-between z-30">
      <button data-route="home" class="nav-btn flex-1 text-center py-2"> <i class="fa-solid fa-house"></i><div class="text-xs">Home</div></button>
      <button data-route="my" class="nav-btn flex-1 text-center py-2"> <i class="fa-solid fa-list"></i><div class="text-xs">My</div></button>
      <button data-route="wallet" class="nav-btn flex-1 text-center py-2"> <i class="fa-solid fa-wallet"></i><div class="text-xs">Wallet</div></button>
      <button data-route="profile" class="nav-btn flex-1 text-center py-2"> <i class="fa-solid fa-user"></i><div class="text-xs">Profile</div></button>
    </nav>

    <!-- Toast area -->
    <div id="toast-area" class="fixed top-6 right-4 z-50"></div>

  </div>

  <!-- Modules -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/router.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/user-data.js"></script>
  <script type="module" src="js/admin-data.js"></script>

  <script>
    // Disable right click, text selection, pinch-zoom & ctrl+scroll zoom for native-app feel
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });
  </script>
</body>
</html>
